<svg viewBox="0 0 960 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Architecture diagram: Swimlane layout — Client / Google Cloud / Google AI -->

  <!-- Swimlane backgrounds -->
  <rect x="16" y="16" width="320" height="408" rx="16" fill="#FAF9F4" stroke="#EAE6DE" stroke-width="1"/>
  <text x="176" y="42" text-anchor="middle" fill="#A39E98" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif" letter-spacing="0.08em">CLIENT</text>
  <line x1="16" y1="52" x2="336" y2="52" stroke="#EAE6DE" stroke-width="1"/>

  <rect x="356" y="16" width="240" height="408" rx="16" fill="#FAF9F4" stroke="#EAE6DE" stroke-width="1"/>
  <text x="476" y="42" text-anchor="middle" fill="#A39E98" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif" letter-spacing="0.08em">GOOGLE CLOUD</text>
  <line x1="356" y1="52" x2="596" y2="52" stroke="#EAE6DE" stroke-width="1"/>

  <rect x="616" y="16" width="328" height="408" rx="16" fill="#FAF9F4" stroke="#EAE6DE" stroke-width="1"/>
  <text x="780" y="42" text-anchor="middle" fill="#A39E98" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif" letter-spacing="0.08em">GOOGLE AI</text>
  <line x1="616" y1="52" x2="944" y2="52" stroke="#EAE6DE" stroke-width="1"/>

  <!-- Widget (Lane 1) -->
  <rect x="36" y="68" width="280" height="52" rx="10" stroke="#F55036" stroke-width="1.5" fill="#FFFDF5"/>
  <text x="176" y="92" text-anchor="middle" fill="#F55036" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">ArionTalk Widget</text>
  <text x="176" y="108" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Web Component (Lit)</text>

  <!-- Sub-modules -->
  <rect x="36" y="134" width="135" height="38" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5"/>
  <text x="103" y="150" text-anchor="middle" fill="#6B6560" font-size="10" font-weight="500" font-family="Inter, system-ui, sans-serif">Page Extractor</text>
  <text x="103" y="163" text-anchor="middle" fill="#A39E98" font-size="8" font-family="Inter, system-ui, sans-serif">Text + Images</text>

  <rect x="181" y="134" width="135" height="38" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5"/>
  <text x="248" y="150" text-anchor="middle" fill="#6B6560" font-size="10" font-weight="500" font-family="Inter, system-ui, sans-serif">Web Audio</text>
  <text x="248" y="163" text-anchor="middle" fill="#A39E98" font-size="8" font-family="Inter, system-ui, sans-serif">Capture + Playback</text>

  <rect x="36" y="182" width="135" height="38" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5"/>
  <text x="103" y="198" text-anchor="middle" fill="#6B6560" font-size="10" font-weight="500" font-family="Inter, system-ui, sans-serif">Highlight Manager</text>
  <text x="103" y="211" text-anchor="middle" fill="#A39E98" font-size="8" font-family="Inter, system-ui, sans-serif">Scroll + Highlight</text>

  <rect x="181" y="182" width="135" height="38" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5"/>
  <text x="248" y="198" text-anchor="middle" fill="#6B6560" font-size="10" font-weight="500" font-family="Inter, system-ui, sans-serif">Barge-in Detect</text>
  <text x="248" y="211" text-anchor="middle" fill="#A39E98" font-size="8" font-family="Inter, system-ui, sans-serif">Energy-based VAD</text>

  <!-- Speech APIs -->
  <rect x="36" y="232" width="280" height="30" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5" stroke-dasharray="5 3"/>
  <text x="176" y="252" text-anchor="middle" fill="#A39E98" font-size="9" font-family="Inter, system-ui, sans-serif">Browser Speech APIs (STT / TTS)</text>

  <!-- Local Engine -->
  <rect x="36" y="274" width="280" height="30" rx="8" stroke="#EAE6DE" stroke-width="1" fill="#FFFDF5" stroke-dasharray="5 3"/>
  <text x="176" y="294" text-anchor="middle" fill="#A39E98" font-size="9" font-family="Inter, system-ui, sans-serif">Local Engine — Gemini Nano (offline)</text>

  <!-- Token Server (Lane 2) -->
  <rect x="380" y="68" width="192" height="130" rx="14" stroke="#F55036" stroke-width="1.5" fill="#FFFDF5"/>
  <text x="476" y="100" text-anchor="middle" fill="#151515" font-size="14" font-weight="700" font-family="Inter, system-ui, sans-serif">Token Server</text>
  <line x1="404" y1="112" x2="548" y2="112" stroke="#EAE6DE" stroke-width="1"/>
  <text x="476" y="132" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Ephemeral tokens</text>
  <text x="476" y="148" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">System instructions</text>
  <text x="476" y="164" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Tool declarations</text>
  <rect x="426" y="178" width="100" height="22" rx="11" fill="#F55036" opacity="0.1"/>
  <text x="476" y="193" text-anchor="middle" fill="#F55036" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">Cloud Run</text>

  <!-- Gemini Live API (Lane 3) -->
  <rect x="640" y="68" width="280" height="130" rx="14" stroke="#F55036" stroke-width="1.5" fill="#FFFDF5"/>
  <text x="780" y="100" text-anchor="middle" fill="#151515" font-size="14" font-weight="700" font-family="Inter, system-ui, sans-serif">Gemini Live API</text>
  <line x1="664" y1="112" x2="896" y2="112" stroke="#EAE6DE" stroke-width="1"/>
  <text x="780" y="132" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Multimodal audio streaming</text>
  <text x="780" y="148" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Function calling (tool use)</text>
  <text x="780" y="164" text-anchor="middle" fill="#A39E98" font-size="10" font-family="Inter, system-ui, sans-serif">Real-time transcription</text>
  <rect x="730" y="178" width="100" height="22" rx="11" fill="#F55036" opacity="0.1"/>
  <text x="780" y="193" text-anchor="middle" fill="#F55036" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">Google AI</text>

  <!-- Arrows -->
  <line x1="316" y1="92" x2="374" y2="92" stroke="#A39E98" stroke-width="1.5"/>
  <polygon points="378,92 370,88 370,96" fill="#A39E98"/>
  <rect x="322" y="76" width="46" height="16" rx="8" fill="#FFFDF5" stroke="#EAE6DE" stroke-width="1"/>
  <text x="345" y="88" text-anchor="middle" fill="#A39E98" font-size="8" font-weight="600" font-family="Inter, system-ui, sans-serif">REST</text>

  <line x1="572" y1="130" x2="634" y2="130" stroke="#A39E98" stroke-width="1.5"/>
  <polygon points="638,130 630,126 630,134" fill="#A39E98"/>

  <path d="M316 155 L340 155 Q348 155 348 163 L348 280 Q348 290 358 290 L770 290 Q780 290 780 280 L780 204" stroke="#F55036" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="780,200 775,210 785,210" fill="#F55036"/>
  <rect x="464" y="278" width="200" height="22" rx="11" fill="#FFFDF5" stroke="#F55036" stroke-width="1"/>
  <text x="564" y="293" text-anchor="middle" fill="#F55036" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">WebSocket (Audio + Tools)</text>

  <path d="M780 200 L780 370 Q780 385 766 385 L110 385 Q96 385 96 371 L96 224" stroke="#F55036" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <polygon points="96,220 91,230 101,230" fill="#F55036" opacity="0.4"/>
  <rect x="360" y="373" width="200" height="20" rx="10" fill="#FFFDF5" stroke="#F55036" stroke-width="0.75" opacity="0.45"/>
  <text x="460" y="387" text-anchor="middle" fill="#F55036" font-size="9" font-family="Inter, system-ui, sans-serif" opacity="0.65">highlight_and_scroll(elementId)</text>
</svg>
